[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ekalavya-delegation"
version = "0.3.0"
description = "Ekalavya delegation control plane and benchmark subsystem"
requires-python = ">=3.11"

[project.scripts]
eka = "ekalavya.cli:main"
ekalavya = "ekalavya.cli:main"

[tool.setuptools]
packages = ["delegation", "ekalavya", "benchmark", "benchmark.v2", "benchmark.public_characterization", "benchmark.gemini_reasoning_r1_1", "benchmark.cross_provider_characterization_r1"]
