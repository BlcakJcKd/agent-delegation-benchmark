[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ekalavya-delegation"
version = "0.3.0"
description = "Ekalavya delegation control plane and benchmark subsystem"
requires-python = ">=3.11"

[project.scripts]
ask-flash = "delegation.cli:ask_flash_main"
ask-haiku = "delegation.cli:ask_haiku_main"
ask-sonnet = "delegation.cli:ask_sonnet_main"
ask-terra = "delegation.cli:ask_terra_main"
ask-luna = "delegation.cli:ask_luna_main"
ask-deepseek-pro = "delegation.cli:ask_deepseek_pro_main"
ask-deepseek-flash = "delegation.cli:ask_deepseek_flash_main"
ask-minimax-m3 = "delegation.cli:ask_minimax_m3_main"
ask-vllm = "delegation.vllm_cli:main"
delegate-status = "delegation.status_cli:main"
delegate-config = "delegation.config_cli:main"
ekalavya = "ekalavya.cli:main"

[tool.setuptools]
packages = ["delegation", "ekalavya", "benchmark", "benchmark.v2"]
